<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* App Store screenshot frame: 440x956 CSS px rendered at 3x = 1320x2868 (6.9"). */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 440px; height: 956px; overflow: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #17141F;
    background: radial-gradient(120% 70% at 50% 0%, #EDE8FF 0%, #F6F4FE 45%, #FFFFFF 100%);
    display: flex; flex-direction: column; align-items: center;
  }
  .text { padding: 58px 32px 0; text-align: center; }
  .kicker {
    display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 1.6px;
    color: #7457F5; background: #fff; border: 1px solid #E4DEFF; border-radius: 99px; padding: 6px 12px;
  }
  h1 { font-family: 'Gloock', serif; font-weight: 400; font-size: 40px; line-height: 1.04; letter-spacing: -0.4px; margin-top: 16px; }
  p { font-size: 15.5px; line-height: 1.45; color: #5D5870; margin-top: 12px; font-weight: 500; }
  .phone {
    margin-top: 34px; width: 318px; height: 690px; border-radius: 46px; background: #17141F; padding: 9px;
    box-shadow: 0 30px 60px -24px rgba(23, 20, 31, 0.32), 0 8px 20px -12px rgba(23, 20, 31, 0.24);
  }
  .screen { width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #fff; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .ba { margin-top: 40px; display: flex; gap: 14px; align-items: flex-start; }
  .card { width: 186px; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 0 22px 44px -22px rgba(23, 20, 31, 0.34); }
  .card img { width: 100%; height: 300px; object-fit: cover; object-position: 50% 22%; display: block; }
  .card span { display: block; text-align: center; font-weight: 700; font-size: 13px; padding: 10px 0 12px; }
  .card.after { margin-top: 56px; }
  .card.after span { color: #7457F5; }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 30px; }
  .chips b { font-size: 12.5px; font-weight: 600; background: #fff; border: 1px solid #E4DEFF; border-radius: 99px; padding: 7px 12px; }
</style>
</head>
<body>
  <div class="text">
    <span class="kicker" id="k"></span>
    <h1 id="t"></h1>
    <p id="s"></p>
  </div>
  <div id="slot"></div>
<script>
  const q = new URLSearchParams(location.search);
  for (const id of ['k', 't', 's']) document.getElementById(id).textContent = q.get(id) || '';
  const slot = document.getElementById('slot');
  if (q.get('mode') === 'ba') {
    const [b, a] = (q.get('labels') || 'Önce|Sonra').split('|');
    slot.innerHTML = `<div class="ba"><div class="card"><img src="before.jpg"><span>${b}</span></div>
      <div class="card after"><img src="after.jpg"><span>${a}</span></div></div>
      <div class="chips">${(q.get('chips') || '').split('|').filter(Boolean).map((c) => `<b>${c}</b>`).join('')}</div>`;
  } else {
    slot.innerHTML = `<div class="phone"><div class="screen"><img src="${q.get('img')}"></div></div>`;
  }
</script>
</body>
</html>
